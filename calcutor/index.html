<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><link rel="stylesheet" href="index.css">
</head>
<body>
    <script src="index.js" defer></script>
  <div id="calculator">
    <input id="display" readonly>
    <div id="keys">
 <div id="button">
        <button onclick="clearDisplay()" class="aft">c</button>
        <button onclick="appendToDisplay('(')" class="aft">()</button>
        <button onclick="appendToDisplay('%')" class="aft">%</button>
        <button onclick="appendToDisplay('/')" class="jpt">/</button>
        <button onclick="appendToDisplay('7')" class="calculate">7</button>
        <button onclick="appendToDisplay('8')" class="calculate">8</button>
        <button onclick="appendToDisplay('9')" class="calculate">9</button>
        <button onclick="appendToDisplay('*')" class="jpt">x</button>
        <button onclick="appendToDisplay('4')" class="calculate">4</button>
        <button onclick="appendToDisplay('5')" class="calculate">5</button>
        <button onclick="appendToDisplay('6')" class="calculate">6</button>
        <button onclick="appendToDisplay('-')" class="jpt">-</button>
        <button onclick="appendToDisplay('1')" class="calculate">1</button>
        <button onclick="appendToDisplay('2')" class="calculate">2</button>
        <button onclick="appendToDisplay('3')" class="calculate">3</button>
        <button onclick="appendToDisplay('+')" class="jpt"> +</button>
        <button onclick="appendToDisplay('+/-')" class="calculate">+/-</button>
        <button onclick="appendToDisplay('0')" class="calculate">0</button>
        <button onclick="appendToDisplay('.')" class="calculate">.</button>
        <button onclick="calculate()" class="ptj">=</button>
        




    </div>
    </div>
  </div> 

       
    
 
    
</body>
